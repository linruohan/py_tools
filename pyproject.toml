[project]
name = "py_tools"
version = "0.1.0"
description = "基于 customtkinter 的桌面应用工具箱"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
requires-python = ">=3.10"
dependencies = [
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pyinstaller>=5.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
# 目标 Python 版本
target-version = "py310"

# 每行最大字符数
line-length = 100

# 排除的目录
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "*.egg-info",
]

[tool.ruff.lint]
# 启用的规则
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "RUF",  # Ruff-specific rules
]

# 忽略的规则
ignore = [
    "E501",   # 行太长（由 formatter 处理）
    "B008",   # 函数调用中的默认参数
    "B904",   # raise ... from err
    "UP042",  # StrEnum 兼容性问题
    "UP047",  # 泛型函数类型参数语法
    "RUF001", # 中文冒号误报
    "RUF002", # 中文逗号误报
    "RUF003", # 中文括号误报
]

# 每个文件允许的未使用导入
per-file-ignores = {"__init__.py" = ["F401"]}

[tool.ruff.format]
# 使用双引号
quote-style = "single"

# 缩进使用空格
indent-style = "space"

# 每个缩进级别的空格数
indent-width = 4

# 行尾使用 LF
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # 逐步启用
ignore_missing_imports = true
no_implicit_optional = true  # 禁止隐式 Optional
check_untyped_defs = true  # 检查未类型化的定义

# 排除的目录
exclude = [
    "venv",
    ".venv",
    "build",
    "dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
]

# 覆盖率配置
[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/.venv/*",
    "*/venv/*",
    "*/build/*",
    "*/dist/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
